name: Administration (liste des magasins)
run-name: "Administration · ${{ inputs.action }} ${{ inputs.demande }}"
# Lancé par l'onglet Administration du tableau de bord : relit les organisations Openbravo
# (docs/data/ref/organisations.json) pour proposer les nouveaux magasins.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "organisations"
        type: choice
        options: [organisations]
        default: organisations
      demande:
        description: "Identifiant de la demande (renseigné par le tableau de bord)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: admin
  cancel-in-progress: false
jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OB_URL: ${{ secrets.OB_URL }}
      OB_USER: ${{ secrets.OB_USER }}
      OB_PASSWORD: ${{ secrets.OB_PASSWORD }}
      OB_MOCK: ${{ vars.OB_MOCK || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Liste des organisations
        run: python -m collector.run organisations
      - name: Enregistrer les données
        run: |
          git config user.name "reporting-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data
          if git diff --cached --quiet; then echo "Aucune nouvelle donnée"; exit 0; fi
          git commit -m "Administration : liste des magasins $(TZ=Europe/Paris date +%F\ %H:%M)"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep 5; done
          echo "::error::Impossible d'enregistrer les données dans le dépôt"; exit 1
