name: Ventes du jour
on:
  schedule:
    - cron: "*/30 7-19 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collecte
  cancel-in-progress: false
jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OB_URL: ${{ secrets.OB_URL }}
      OB_USER: ${{ secrets.OB_USER }}
      OB_PASSWORD: ${{ secrets.OB_PASSWORD }}
      OB_MOCK: ${{ vars.OB_MOCK || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collecter les ventes du jour
        run: python -m collector.run ventes
      - name: Enregistrer les données
        run: |
          git config user.name "reporting-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data
          if git diff --cached --quiet; then echo "Aucune nouvelle donnée"; exit 0; fi
          git commit -m "Données : ventes $(TZ=Europe/Paris date +%F\ %H:%M)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
