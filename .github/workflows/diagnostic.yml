name: Diagnostic API (manuel)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OB_URL: ${{ secrets.OB_URL }}
      OB_USER: ${{ secrets.OB_USER }}
      OB_PASSWORD: ${{ secrets.OB_PASSWORD }}
      OB_MOCK: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tester les API Openbravo
        run: python -m collector.run diagnostic
      - name: Publier les échantillons bruts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-echantillons
          path: diagnostic/
          if-no-files-found: ignore
